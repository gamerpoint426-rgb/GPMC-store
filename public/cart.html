<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b12"><title>Cart | GamerPointMC</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html"><img src="assets/logo.png" alt="GamerPointMC logo"><span>GAMERPOINT<span class="gradient">MC</span></span></a><nav class="links"><a href="index.html">Home</a><a href="ranks.html">Ranks</a><a href="coins.html">Coins</a><a href="tags.html">Tags</a><a href="cart.html">Cart <span id="cart-count">0</span></a><a href="how-to-order.html">How to order</a></nav><a class="btn" href="ranks.html">Shop now</a></div></header><main class="wrap"><section class="page-head"><div class="eyebrow">YOUR SELECTION</div><h1>Shopping cart</h1><p class="muted">Check your items before checkout.</p></section><section class="panel"><div id="cart-items"></div><div class="cart-row"><b>Total</b><b id="cart-total">₹0</b></div><p><a class="btn" href="checkout.html" id="checkout-btn">Continue to payment</a> <button class="btn secondary" onclick="localStorage.removeItem('gpmc_cart');location.reload()">Clear cart</button></p></section></main><script>function draw(){let c=getCart(),box=document.getElementById('cart-items');if(!c.length){box.innerHTML='<div class="empty">Your cart is empty. <a href="ranks.html">Browse the store</a>.</div>';document.getElementById('checkout-btn').style.pointerEvents='none';document.getElementById('checkout-btn').style.opacity='.4'}else{box.innerHTML=c.map((x,i)=>`<div class="cart-row"><div><b>${x.name}</b><div class="muted">Qty: ${x.qty}</div></div><div><b>${money(x.price*x.qty)}</b> <button class="btn secondary" onclick="removeItem(${i})">Remove</button></div></div>`).join('')}document.getElementById('cart-total').textContent=money(c.reduce((a,x)=>a+x.price*x.qty,0))}function removeItem(i){let c=getCart();c.splice(i,1);setCart(c);draw()}document.addEventListener('DOMContentLoaded',draw)</script><footer class="footer"><div class="wrap">© 2026 GamerPointMC · Java & Bedrock Network · <a href="how-to-order.html">How to order</a></div></footer><script src="common.js"></script></body></html>
